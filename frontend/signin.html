<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>ContactLein – Sign In</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to your ContactLein account." />

    <link rel="icon" href="images/favicon.ico" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>

    <style>
        :root {
            --mc-blue: #2563eb;
            --mc-deep-blue: #0f2a5e;
        }

        * {
            transition: background-color .2s ease, color .2s ease, border-color .2s ease;
        }

        body {
            min-height: 100vh;
        }

        [data-bs-theme="dark"] body {
            background: #0d1117;
            color: #e8edf5;
        }

        [data-bs-theme="light"] body {
            background: #f0f6ff;
            color: #0d1117;
        }

        .navbar {
            background: var(--mc-deep-blue) !important;
        }

        .auth-wrapper {
            min-height: calc(100vh - 72px);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            overflow: hidden;
        }

        [data-bs-theme="dark"] .auth-card {
            background: #161f2e;
            border: 1px solid #1e3a6e;
        }

        [data-bs-theme="light"] .auth-card {
            background: #fff;
            border: 1px solid #c9d9f5;
        }

        .form-control,
        .input-group-text {
            border-radius: 10px;
        }

        [data-bs-theme="dark"] .form-control,
        [data-bs-theme="dark"] .input-group-text {
            background: #0d1b2e;
            border-color: #1e3a6e;
            color: #e8edf5;
        }

        [data-bs-theme="dark"] .form-control:focus {
            background: #0d1b2e;
            color: #fff;
            border-color: var(--mc-blue);
            box-shadow: 0 0 0 .2rem rgba(37,99,235,.25);
        }

        [data-bs-theme="dark"] .form-control::placeholder {
            color: #7b8ba7;
        }

        .btn-primary {
            background: var(--mc-blue);
            border-color: var(--mc-blue);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .required-label::after {
            content: " *";
            color: #ef4444;
        }

        #themeToggle {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            opacity: .7;
        }

        #serverError {
            display: none;
        }
    </style>
</head>

<body>

<nav class="navbar px-3">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold fs-4 text-white" href="#">
            ContactLein
        </a>

        <button id="themeToggle"
                class="btn btn-outline-light rounded-circle"
                aria-label="Toggle theme">
            <i id="themeIcon" class="bi bi-moon-fill"></i>
        </button>

    </div>
</nav>

<main class="container auth-wrapper d-flex justify-content-center align-items-center">

    <section class="card auth-card shadow-lg">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-2">Welcome Back</h1>
                <p class="text-body-secondary mb-0">
                    Sign in to manage your contacts.
                </p>
            </div>

            <!-- Server-side error banner -->
            <div id="serverError" class="alert alert-danger py-2 mb-3" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span id="serverErrorMsg"></span>
            </div>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="username" class="form-label required-label">
                        Username
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Enter username"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label required-label">
                        Password
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter password"
                               autocomplete="current-password"
                               required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Sign In
                </button>

            </form>

            <div class="text-center mt-4">
                <span class="text-body-secondary">Don't have an account?</span>
                <a href="signup.html" class="text-decoration-none fw-semibold">Sign Up</a>
            </div>

        </div>
    </section>

</main>

<footer class="text-center small pb-3">
    © 2026 ContactLein. All rights reserved.
</footer>

<script>
/* ── Theme ── */
const htmlEl = document.documentElement;

function applyTheme(theme) {
    htmlEl.setAttribute('data-bs-theme', theme);
    document.getElementById('themeIcon').className =
        theme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    localStorage.setItem('theme', theme);
}

applyTheme(localStorage.getItem('theme') || 'dark');

document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
});

/* ── API Base URL ── */
const API_BASE = window.location.hostname === 'localhost'
    ? 'http://206.81.15.115'
    : 'http://206.81.15.115';

/* ── Submit → login.php ── */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    const submitBtn    = document.getElementById('submitBtn');
    const serverError  = document.getElementById('serverError');
    const serverErrorMsg = document.getElementById('serverErrorMsg');

    // Hide previous errors
    serverError.style.display = 'none';

    if (!username || !password) {
        serverErrorMsg.textContent = 'Please fill in all fields.';
        serverError.style.display = 'block';
        return;
    }

    // Loading state
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing in…';

    try {
        const response = await fetch(`${API_BASE}/login.php`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        // login.php returns {"error":"..."} on failure
        if (data.error && data.error !== '') {
            serverErrorMsg.textContent = data.error;
            serverError.style.display = 'block';
            return;
        }

        // FIX: login.php returns id / firstName / lastName — not token / username
        localStorage.setItem('userId',    data.id);
        localStorage.setItem('firstName', data.firstName);
        localStorage.setItem('lastName',  data.lastName);

        window.location.href = 'index.html';

    } catch (err) {
        console.error(err);
        serverErrorMsg.textContent = 'Could not reach the server. Please try again.';
        serverError.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
