<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>COP4331 Small Project</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/styles.css" type="text/css">
    </head>

    <body>
        <div class ="p-5 bg-primary text-white text-center">
                <h1>MagCon</h1>
                <p>Magic in Every Connection</p>
        </div>

        <!-- Sign In Form -->
        <div class = "d-flex justify-content-center align-items-center vh-100">
            <main class="border rounded p-5 shadow" style="width: 100%; max-width: 400px;">
                
                <!--Username & Password-->
                <form action="https://api.example.com/users" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="username" class="form-control" id="username" placeholder="Enter Username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter Password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
            
                <!--Transition to Sign Up Form-->
                <div class="text-center mt-3">
                    Don't Have An Account?<a href="signup.html"> Sign Up!</a>  
                </div>
            </main> 
        </div>
       
        <footer>
            © 2026 MagCon. All rights reserved.
        </footer>
        
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
