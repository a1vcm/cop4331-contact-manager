<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <title>MagCon</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!--Navigation Bar-->
            <nav class="navbar bg-dark px-3">
                <div class="container-fluid position-relative" align-items-center">
                    
                    <!--Logo-->
                    <a class="navbar-brand fw-bold fs-4 text-white mb-0" href="index.html">MagCon</a>

                    <!--Search-->
                    <form class="d-flex justify-content-center px-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>

                    <!--Profile-->
                    <div class="d-flex justify-content-end">
                        <a class="ms-auto" role="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasProfile" aria-controls="offcanvasProfile">
                            <img src="images/profile.png" alt="Profile" width="50" class="rounded-pill"/>
                        </a>
                    </div>
                    
                </div>
            </nav>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasProfile" aria-labelledby="offcanvasProfileLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasProfileLabel">Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <!-- Profile content goes here -->
                    <p>Name: John Doe</p>
                    <p>Email: john.doe@example.com</p>
                    <p>Phone: (123) 456-7890</p>
                    <p>Member since: January 2023</p>
                    <p><a href="signin.html">Logout</a></p>
                </div>
            </div>
        </header>
        <main class="container">
            <!-- Add a Contact Section -->
            <section class="card">
                <h2> Add a Contact</h2>
                <form method="POST" class="form-grid">
                    <input type="text" name="firstName" placeholder="First Name" required>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                    <input type="email"name="email" placeholder="Email" required>
                    <input type="tel" name="phoneNumber" placeholder="Phone Number" required>
                    <button type="submit" class="btn btn-primary">Add Contact</button>
                </form> 
            </section>

            <!-- Contact List Section -->
             <section class="card mt-4">
                <h2>Contact List</h2>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">First Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone Number</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Example contact entry -->
                        <tr>
                            <td>John</td>
                            <td>Doe</td>
                            <td>john.doe@example.com</td>
                            <td>(123) 456-7890</td>
                            <td><a href="edit-contact.html" data-bs-toggle="modal" data-bs-target="#editContactModal">Edit</a> | <a href="delete-contact.html" data-bs-toggle="modal" data-bs-target="#deleteContactModal">Delete</a></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
